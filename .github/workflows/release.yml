name: Release

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.0.0

permissions:
  contents: write  # Needed to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained exe
        run: dotnet publish LlmTranslateResx.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Add PowerShell scripts to package
        shell: pwsh
        run: Copy-Item ./*.ps1 ./publish/

      - name: Add samples to package
        shell: pwsh
        run: Copy-Item ./samples ./publish/ -Recurse

      - name: Convert documentation to HTML
        uses: natescherer/markdown-to-html-with-github-style-action@v1.1.0
        with:
          path: README.md,samples/readme.md
          outputpath: ./publish
          matchpathstructure: true

      - name: Remove Markdown documentation
        shell: pwsh
        run: Remove-Item ./publish/README.md, ./publish/samples/readme.md -ErrorAction SilentlyContinue

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath "./LlmTranslateResx-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./LlmTranslateResx-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}